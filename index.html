<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Mtto Preventivo · Operador</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#172126;--sub:#5d6b73;--line:#d8e0e4;--acc:#2563eb;--bad:#b3261e;--ok:#1e7a45;--warn:#b36b00;--shadow:0 8px 24px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}.app{max-width:560px;margin:auto;min-height:100dvh;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-weight:900;font-size:21px}.net{font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
h2,h3{margin:0 0 12px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:12px}
textarea{min-height:90px;resize:vertical}.btn{width:100%;border:0;border-radius:13px;padding:14px 16px;font-weight:900;background:var(--acc);color:#fff;margin-top:10px;cursor:pointer}
.btn.sec{background:#e8eef1;color:var(--ink)}.btn.danger{background:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#eef3f5;border-radius:13px;padding:12px}.stat b{display:block;font-size:20px}
.hint,.muted{color:var(--sub);font-size:13px}.hidden{display:none!important}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;font-weight:850;min-height:58px;cursor:pointer}.action.full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#eef3f5;padding:6px 9px;font-size:12px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.46);display:none;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#fff;font-weight:800;cursor:pointer}.chip.sel{background:var(--acc);color:#fff;border-color:var(--acc)}.chip.no{background:#ffe9e7;color:#8c1d18;border-color:#efb4af}
.msg{white-space:pre-wrap;background:#f6f8f9;border:1px solid var(--line);border-radius:13px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;max-height:42dvh;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172126;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;z-index:40;display:none}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1417;--card:#172126;--ink:#f1f5f6;--sub:#aebbc1;--line:#344148;--acc:#60a5fa;--shadow:none}input,select,textarea,.action,.chip{background:#11191d;color:var(--ink)}.stat,.pill{background:#222e34}.btn.sec{background:#2b383e;color:#fff}.msg{background:#11191d}}
body.ocupado button{pointer-events:none}
.step-title{font-size:13px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 8px}
.choice-list{display:grid;grid-template-columns:1fr;gap:8px}
.choice-list .chip{width:100%;text-align:left;padding:12px 14px}
.sel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sel-head b{font-size:18px}.mini{border:0;background:none;color:var(--acc);font:inherit;font-size:13px;text-decoration:underline;padding:8px;cursor:pointer}
.log-panel{max-height:55dvh;overflow:auto;border-top:1px solid var(--line);margin-top:8px}
.log-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.water-zero{display:none;color:var(--bad);font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">#_Mtto_Preventivo</div><div class="net" id="net">●</div></div>

  <section id="s-open" class="card">
    <h2>Abrir jornada</h2>
    <label for="placa">Placa</label>
    <select id="placa"><option value="">Selecciona placa...</option></select>

    <label for="bt-input">Barrio / Tarea</label>
    <div id="bt-wrap">
      <input id="bt-input" autocomplete="off" placeholder="Primero selecciona una placa..." disabled>
    </div>

    <select id="tarea" style="display:none"></select>
    <input id="barrio" type="hidden">

    <div class="hint" id="ap-hint"></div>
    <button class="btn" id="btn-ini" disabled>Iniciar jornada</button>
  </section>

  <section id="s-dash" class="hidden">
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div>
          <div class="pill" id="d-placa"></div>
          <h2 id="d-barrio" style="margin-top:9px"></h2>
          <div class="muted" id="d-tarea"></div>
        </div>
        <div style="text-align:right">
          <div class="muted">Tiempo restante</div>
          <b id="d-time">--:--</b>
          <div class="muted" id="d-sync"></div>
        </div>
      </div>
      <div class="grid2" style="margin-top:12px">
        <div class="stat"><span>ML</span><b id="d-ml">0</b></div>
        <div class="stat"><span>Agua</span><b id="d-m3">0</b></div>
      </div>
      <button class="btn sec" id="btn-bit">Bitácora</button>
    </div>

    <div class="card">
      <h3>Registrar</h3>
      <div class="actions">
        <button class="action" id="a-tramo">Abrir tramo</button>
        <button class="action" id="a-cierre">Cerrar tramo</button>
        <button class="action" id="a-m3">Carga de agua</button>
        <button class="action" id="a-nov">Novedad</button>
        <button class="action full" id="a-desob">Desobstrucción</button>
        <button class="action full" id="a-fin">Cerrar jornada</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSfERpt4S-r5oDgoAsGMDFYq-RdhOiFsszFjjPTnA_Utm3ZSVQ/formResponse";
const API="https://script.google.com/macros/s/AKfycbwDy1V9_-gn0p4fNwVFnQJKJgYewW5ZfjmkRJpV8ckUwXzXWExAIgbuw0x-dUXORV4T/exec";

const MAX_H=10, ML_MAX=130;
const KJ="mtto_j_v3",KQ="mtto_q_v3",KD="mtto_d_v3",KT="mtto_tab_v3";

const PLACAS=[
["KPN 603","Vactor"],["LPK 666","Vactor"],["WOW 047","Vactor"],
["GFP 750","Vactor"],["GKV 830","Succión"],["JLO 019","Succión"],
["LPL301","Ingemac"],["KPN 602","Ingemac"],["THQ 592","Ingemac"],
["Otras","Otras"]
];

const CAUSAS=["Mecánica/Motor","Descarga de lodos","Fuerza mayor","Factor humano"];

const DETALLES={
  "Mecánica/Motor":["Hidráulica","Mecánica/Motor","Succión/Presión","Eléctrica"],
  "Factor humano":["Falta de personal","Relevo de cuadrilla","Seguridad/SST","Otra"]
};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const cap=s=>s?String(s).trim().replace(/\s+/g," ").replace(/\b\w/g,c=>c.toUpperCase()):"";
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9);
const now=()=>new Date();
const fecha=d=>new Date(d).toLocaleDateString("es-CO");
const hora=d=>new Date(d).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
const save=()=>J&&localStorage.setItem(KJ,JSON.stringify(J));
const load=()=>{try{return JSON.parse(localStorage.getItem(KJ)||"null")}catch{return null}};
const qload=()=>{try{return JSON.parse(localStorage.getItem(KQ)||"[]")}catch{return []}};
const qsave=q=>localStorage.setItem(KQ,JSON.stringify(q));
const dload=()=>{try{return JSON.parse(localStorage.getItem(KD)||"[]")}catch{return []}};
const dsave=d=>localStorage.setItem(KD,JSON.stringify(d.slice(-500)));
const buzz=()=>navigator.vibrate&&navigator.vibrate(35);

let J=load(),P=null,tareas=[],tareaSel=null,gpsBarrio="",busy=false;

PLACAS.forEach(p=>{
  const o=document.createElement("option");
  o.value=p[0];o.textContent=p[0]+" — "+p[1];
  $("placa").appendChild(o);
});

function toast(t){
  const e=$("toast");e.textContent=t;e.style.display="block";
  clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)
}

async function una(fn){
  if(busy)return;
  busy=true;
  document.body.classList.add("ocupado");
  try{await fn()}
  catch(e){console.error(e);toast("No se pudo completar. Intenta de nuevo.")}
  finally{busy=false;document.body.classList.remove("ocupado")}
}

function show(id){
  ["s-open","s-dash"].forEach(x=>$(x).classList.toggle("hidden",x!==id))
}

function sheet(h){
  $("sheet").innerHTML=h;
  $("ov").style.display="flex"
}

function cerrarSheet(){
  $("ov").style.display="none";
  $("sheet").innerHTML=""
}

function ask(t,b,ok="Continuar"){
  return new Promise(res=>{
    sheet(`<h3>${esc(t)}</h3><p>${esc(b)}</p>
    <button class="btn danger" id="ask-ok">${esc(ok)}</button>
    <button class="btn sec" id="ask-no">Cancelar</button>`);
    $("ask-ok").onclick=()=>{cerrarSheet();res(true)};
    $("ask-no").onclick=()=>{cerrarSheet();res(false)}
  })
}

function log(t){
  if(!J)return;
  J.log=J.log||[];
  J.log.push(`${hora(new Date())} · ${t}`);
  save()
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+uid().replace(/-/g,"_");
    const s=document.createElement("script");
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error("timeout"))
    },9000);

    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      s.remove()
    }

    window[cb]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error("jsonp"))};

    const u=new URL(API);
    Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
    u.searchParams.set("callback",cb);
    s.src=u.toString();
    document.head.appendChild(s)
  })
}

/* ---------- IndexedDB evidencia ---------- */

const DBN="mtto_evidencias_v1",STORE="fotos";

function idb(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error)
  })
}

async function idbSet(k,v){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(v,k);
    tx.oncomplete=res;
    tx.onerror=()=>rej(tx.error)
  })
}

async function idbGet(k){
  const db=await idb();
  return new Promise((res,rej)=>{
    const r=db.transaction(STORE).objectStore(STORE).get(k);
    r.onsuccess=()=>res(r.result||null);
    r.onerror=()=>rej(r.error)
  })
}

async function idbClear(){
  const db=await idb();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete=res;
    tx.onerror=()=>rej(tx.error)
  })
}

/* ---------- GPS ---------- */

function getGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);

    navigator.geolocation.getCurrentPosition(
      p=>res({
        lat:+p.coords.latitude.toFixed(6),
        lng:+p.coords.longitude.toFixed(6)
      }),
      ()=>res(null),
      {enableHighAccuracy:false,timeout:4000,maximumAge:60000}
    )
  })
}

/* ---------- apertura: Barrio / Tarea único ---------- */

function validarAp(){
  const ok=$("placa").value &&
           $("barrio").value.trim() &&
           (!tareas.length || tareaSel);

  $("btn-ini").disabled=!ok;
}

function ponerBT(valor,editable,placeholder){
  $("bt-wrap").innerHTML=
    `<input id="bt" autocomplete="off"
      ${editable?"":"readonly"}
      placeholder="${esc(placeholder||"")}"
      value="${esc(valor||"")}">`;

  $("bt").oninput=()=>{
    $("barrio").value=$("bt").value;
    validarAp()
  };
}

function ponerBTLista(){
  $("bt-wrap").innerHTML=
    `<select id="bt">
      <option value="">Selecciona Barrio / Tarea...</option>
      ${tareas.map(t=>
        `<option value="${esc(t.idTarea)}">${esc(t.nombre||t.barrio)}</option>`
      ).join("")}
    </select>`;

  $("bt").onchange=()=>{
    const t=tareas.find(x=>x.idTarea===$("bt").value);
    tareaSel=t||null;
    $("barrio").value=t?t.barrio:"";
    validarAp()
  };
}

$("placa").onchange=async()=>{
  tareas=[];
  tareaSel=null;
  $("tarea").innerHTML="";
  $("barrio").value="";
  $("ap-hint").textContent="";
  validarAp();

  const p=$("placa").value;

  if(!p){
    ponerBT("",false,"Primero selecciona una placa...");
    return
  }

  ponerBT("",false,"Consultando programación...");
  $("ap-hint").textContent="Consultando programación...";

  try{
    const d=await jsonp({
      action:"tareasPorPlaca",
      placa:p,
      fecha:new Date().toISOString().slice(0,10)
    });

    if(d&&d.ok&&Array.isArray(d.tareas)&&d.tareas.length){
      tareas=d.tareas;
      $("ap-hint").textContent="";

      if(tareas.length===1){
        tareaSel=tareas[0];
        $("barrio").value=tareaSel.barrio;
        ponerBT(tareaSel.nombre||tareaSel.barrio,false,"");
      }else{
        ponerBTLista();
      }

    }else if(d&&d.ok){
      sinTarea("Sin Tarea activa: barrio detectado por GPS, editable.");

    }else{
      ponerBT("",false,"Motor no confirmó la programación");
      $("ap-hint").textContent=
        "No se abrirá la jornada hasta confirmar la programación.";
    }

  }catch(e){
    ponerBT("",false,"Sin respuesta del Motor");
    $("ap-hint").textContent=
      "No se abrirá la jornada hasta recuperar comunicación con el Motor.";
  }

  validarAp();
};

function sinTarea(m){
  tareas=[];
  tareaSel=null;
  $("ap-hint").textContent=m;
  $("barrio").value=gpsBarrio||"";
  ponerBT(gpsBarrio||"",true,"Barrio detectado por GPS");
  validarAp()
}

$("btn-ini").onclick=()=>una(async()=>{
  const placa=$("placa").value;
  const barrio=cap($("barrio").value.trim());

  if(!placa||!barrio||J)return;

  const g=await getGPS();
  const n=now();

  await idbClear();

  J={
    id:uid(),
    placa,
    contratista:(PLACAS.find(p=>p[0]===placa)||[,""])[1],
    barrio,
    idTarea:tareaSel?tareaSel.idTarea:"",
    tarea:tareaSel?(tareaSel.nombre||tareaSel.barrio):"",
    origenBarrio:tareaSel?"TAREA":"GPS",
    t0:n.toISOString(),
    seq:0,
    msgs:[],
    ultimo:null,
    tramos:[],
    novedades:[],
    m3:0,
    cargasAgua:[],
    abierto:null,
    log:[],
    avisado:false,
    forzado:false
  };

  const turno=(n.getHours()>=6&&n.getHours()<18)?"Diurno":"Nocturno";

  const D=reg(
    "jornadaInicio",
    "AJ",
    "Apertura de jornada",
    {
      lat:g?g.lat:"",
      lng:g?g.lng:"",
      direccion:"",
      turno,
      idTarea:J.idTarea,
      origenBarrio:J.origenBarrio
    },
    [
      "Contratista: "+J.contratista,
      "Turno: "+turno,
      "Barrio: "+J.barrio
    ].concat(J.tarea?["Tarea: "+J.tarea]:[]),
    false
  );

  buzz();
  render();
  show("s-dash");
  abrirPanel(D)
});

/* ---------- cola de envío ---------- */

function hito(tipo,datos={}){
  if(!J)return;

  const a={
    actionId:uid(),
    jid:J.id,
    tipo,
    datos,
    placa:J.placa,
    contratista:J.contratista,
    barrio:J.barrio,
    inspector:"",
    at:new Date().toISOString()
  };

  const q=qload();
  q.push(a);
  qsave(q);
  flush()
}

async function enviar(a){
  const f=new FormData();

  f.append("entry.1000001",a.actionId);
  f.append("entry.1000002",a.jid);
  f.append("entry.1000003",a.at);
  f.append("entry.1000004",a.tipo);
  f.append("entry.1000005",a.placa);
  f.append("entry.1000006",a.contratista);
  f.append("entry.1000007",a.barrio);
  f.append("entry.1000008",a.inspector||"");
  f.append("entry.1000009",JSON.stringify(a.datos||{}));

  await fetch(FORM,{
    method:"POST",
    mode:"no-cors",
    body:f
  });

  return true
}

async function flush(){
  if(!navigator.onLine)return;

  const q=qload();
  if(!q.length){
    renderSync();
    return
  }

  const done=dload();
  const left=[];

  for(const a of q){
    if(done.includes(a.actionId))continue;

    try{
      await enviar(a);
      done.push(a.actionId)
    }catch(e){
      left.push(a)
    }
  }

  dsave(done);
  qsave(left);
  renderSync()
}

window.addEventListener("online",flush);
window.addEventListener("offline",renderSync);

/* ---------- extractos ---------- */

function folio(pref){
  J.seq=(J.seq||0)+1;
  save();
  return `${pref}-${String(J.seq).padStart(3,"0")}`
}

function mensaje(f,titulo,lineas=[]){
  return [
    `#_Mtto_Preventivo`,
    ``,
    `${J.placa} · ${J.barrio}`,
    `${fecha(new Date())}`,
    `Folio: ${f}`,
    ``,
    titulo.toUpperCase(),
    ...lineas,
    ``,
    `Hora: ${hora(new Date())}`
  ].join("\n")
}

function reg(tipo,pref,titulo,datos,lineas=[],foto=true){
  const f=folio(pref);
  const msg=mensaje(f,titulo,lineas);

  J.msgs=J.msgs||[];
  J.msgs.push(msg);
  J.ultimo=f;

  save();
  hito(tipo,{...datos,folio:f});

  return {folio:f,msg,titulo,foto}
}

/* ---------- copiado seguro ---------- */

function copiar(t){
  if(navigator.clipboard&&isSecureContext){
    return navigator.clipboard.writeText(t)
      .then(()=>true)
      .catch(()=>false);
  }

  return Promise.resolve(false)
}

/* ---------- POLAROID ---------- */

function cargarImagen(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();

    r.onload=()=>{
      const im=new Image();
      im.onload=()=>res(im);
      im.onerror=rej;
      im.src=r.result
    };

    r.onerror=rej;
    r.readAsDataURL(file)
  })
}

async function crearPolaroid(file,D){
  const im=await cargarImagen(file);

  const W=1200;
  const H=1500;
  const pad=70;
  const fotoX=pad;
  const fotoY=pad;
  const fotoW=W-pad*2;
  const fotoH=1000;

  const c=document.createElement("canvas");
  c.width=W;
  c.height=H;

  const x=c.getContext("2d");

  x.fillStyle="#ffffff";
  x.fillRect(0,0,W,H);

  const scale=Math.max(fotoW/im.width,fotoH/im.height);
  const sw=fotoW/scale;
  const sh=fotoH/scale;
  const sx=(im.width-sw)/2;
  const sy=(im.height-sh)/2;

  x.drawImage(
    im,
    sx,sy,sw,sh,
    fotoX,fotoY,fotoW,fotoH
  );

  x.fillStyle="#172126";
  x.font="700 42px system-ui";
  x.fillText(`${J.placa} · ${D.titulo}`,pad,1160);

  x.font="600 34px system-ui";
  x.fillText(`${J.barrio}`,pad,1220);

  x.font="500 31px system-ui";
  x.fillText(`${fecha(new Date())} · ${hora(new Date())}`,pad,1280);

  x.font="700 30px system-ui";
  x.fillText(`Folio ${D.folio}`,pad,1340);

  return new Promise(res=>
    c.toBlob(
      b=>res(b),
      "image/jpeg",
      .9
    )
  )
}

async function blobUrl(blob){
  return URL.createObjectURL(blob)
}

/* ---------- panel extracto ---------- */

function abrirPanel(D,fn){
  P=D;
  P.onDone=fn||null;
  P.copiado=false;
  pintarPanel()
}

async function pintarPanel(){
  if(!P)return;

  const foto=await idbGet(P.folio);

  sheet(`
    <h3>✓ Hito registrado</h3>

    <div class="step-title">Extracto listo para WhatsApp</div>

/* ---------- PDF ---------- */

function cargarJSPDF(){
  return new Promise((res,rej)=>{
    if(window.jspdf)return res();

    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=res;
    s.onerror=rej;
    document.head.appendChild(s)
  })
}

async function blobDataURL(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=rej;
    r.readAsDataURL(blob)
  })
}

function gruposFotos(n){
  if(n<=0)return[];

  if(n<=4)return[n];

  const grupos=[];
  let resto=n;

  while(resto>0){
    if(resto===5){
      grupos.push(2,3);
      break
    }

    if(resto===6){
      grupos.push(3,3);
      break
    }

    if(resto===7){
      grupos.push(3,4);
      break
    }

    if(resto===8){
      grupos.push(4,4);
      break
    }

    grupos.push(4);
    resto-=4
  }

  return grupos
}

async function generarPDF(X){
  try{
    await cargarJSPDF();

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    });

    const pw=210;
    const ph=297;
    const m=14;

    pdf.setFont("helvetica","bold");
    pdf.setFontSize(17);
    pdf.text("#_Mtto_Preventivo",m,18);

    pdf.setFontSize(13);
    pdf.text("Cierre de jornada",m,27);

    pdf.setFont("helvetica","normal");
    pdf.setFontSize(10);

    let y=38;

    const lineas=[
      `Placa: ${X.placa}`,
      `Contratista: ${X.contratista}`,
      `Barrio: ${X.barrio}`,
      X.tarea?`Tarea: ${X.tarea}`:"",
      `Inicio: ${fecha(X.t0)} ${hora(X.t0)}`,
      `ML total: ${(X.tramos||[]).reduce((a,t)=>a+(Number(t.ml)||0),0)}`,
      `Agua total: ${Number(X.m3||0)} m³`,
      `Tramos registrados: ${(X.tramos||[]).length}`,
      `Novedades: ${(X.novedades||[]).length}`
    ].filter(Boolean);

    lineas.forEach(t=>{
      pdf.text(t,m,y);
      y+=6
    });

    if((X.log||[]).length){
      y+=4;
      pdf.setFont("helvetica","bold");
      pdf.text("Bitácora",m,y);
      y+=6;

      pdf.setFont("helvetica","normal");

      for(const l of X.log){
        const arr=pdf.splitTextToSize(l,pw-m*2);

        if(y+arr.length*5>ph-15){
          pdf.addPage();
          y=18
        }

        pdf.text(arr,m,y);
        y+=arr.length*5+1
      }
    }

    const evidencias=[];

    for(const msg of X.msgs||[]){
      const match=msg.match(/Folio:\s*([^\n]+)/);
      if(!match)continue;

      const fol=match[1].trim();
      const b=await idbGet(fol);

      if(b){
        evidencias.push({
          folio:fol,
          blob:b
        })
      }
    }

    if(evidencias.length){
      const grupos=gruposFotos(evidencias.length);
      let pos=0;

      for(const cant of grupos){
        pdf.addPage();

        const gap=8;
        const top=18;
        const bottom=15;
        const usableW=pw-m*2;
        const usableH=ph-top-bottom;

        let cols=2;
        let rows=cant<=2?1:2;

        const cellW=(usableW-gap)/2;
        const cellH=(usableH-gap*(rows-1))/rows;

        for(let i=0;i<cant;i++){
          const ev=evidencias[pos+i];
          const col=i%2;
          const row=Math.floor(i/2);

          const x=m+col*(cellW+gap);
          const yy=top+row*(cellH+gap);

          const data=await blobDataURL(ev.blob);

          const ratio=1200/1500;

          let iw=cellW;
          let ih=iw/ratio;

          if(ih>cellH-10){
            ih=cellH-10;
            iw=ih*ratio
          }

          const ix=x+(cellW-iw)/2;
          const iy=yy+4;

          pdf.addImage(
            data,
            "JPEG",
            ix,
            iy,
            iw,
            ih,
            undefined,
            "FAST"
          );

          pdf.setFont("helvetica","normal");
          pdf.setFontSize(8);

          pdf.text(
            `Evidencia ${pos+i+1} de ${evidencias.length} · ${ev.folio}`,
            x,
            Math.min(yy+cellH-2,iy+ih+5)
          )
        }

        pos+=cant
      }
    }

    pdf.save(
      `Jornada_${String(X.placa).replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.pdf`
    );

  }catch(e){
    console.error("PDF",e);
    toast("La jornada cerró, pero no se pudo generar el PDF")
  }
}

/* ---------- bitácora ---------- */

$("btn-bit").onclick=()=>{
  if(!J)return;

  const items=(J.log||[]).length
    ?J.log.map(x=>`<div class="log-item">${esc(x)}</div>`).join("")
    :`<p>Sin registros.</p>`;

  sheet(`
    <h3>Bitácora de jornada</h3>

    <div class="log-panel">${items}</div>

    <button class="btn sec" id="bit-cp">Copiar bitácora</button>
    <button class="btn" onclick="cerrarSheet()">Cerrar</button>
  `);

  $("bit-cp").onclick=async()=>{
    const t=(J.log||[]).join("\n")||"Sin registros";

    toast(
      await copiar(t)
        ?"Bitácora copiada"
        :"Tu teléfono no permite copiar desde aquí"
    )
  }
};

/* ---------- protecciones 10 h ---------- */

function restante(){
  if(!J)return 0;

  const fin=new Date(J.t0).getTime()+MAX_H*3600000;
  return fin-Date.now()
}

function tick(){
  if(!J)return;

  const r=restante();

  if(r<=0){
    $("d-time").textContent="00:00";
    autoCierre();
    return
  }

  const min=Math.floor(r/60000);
  const h=Math.floor(min/60);
  const mm=min%60;

  $("d-time").textContent=
    `${String(h).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;

  if(r<=30*60000&&!J.avisado){
    J.avisado=true;
    save();
    toast("Quedan menos de 30 minutos de jornada")
  }
}

async function autoCierre(){
  if(!J||J._cerrandoAuto)return;

  J._cerrandoAuto=true;
  save();

  await cierre({
    automatico:true,
    tipoCierre:"AUTOMATICO_10H",
    motivoCierre:"ABANDONO_LIMITE_JORNADA"
  })
}

setInterval(tick,30000);

/* ---------- arranque ---------- */

(async function init(){
  renderSync();

  if(J){
    render();
    show("s-dash");

    if(restante()<=0){
      autoCierre()
    }

  }else{
    show("s-open");
    ponerBT("",false,"Primero selecciona una placa...");
  }

  const g=await getGPS();

  if(g){
    gpsBarrio="";

    if(
      !J &&
      !$("barrio").value &&
      !tareas.length &&
      $("placa").value
    ){
      $("barrio").value=gpsBarrio;
      ponerBT(
        gpsBarrio,
        true,
        "Barrio detectado por GPS"
      );
      validarAp()
    }
  }

  flush()
})();
</script>
