<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mtto Preventivo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff;padding:22px 18px 40px}
h1{font-size:24px;margin:0 0 28px}label{display:block;font-weight:700;margin:20px 0 8px}
select,button{width:100%;min-height:54px;border-radius:12px;font-size:17px}
select{padding:0 14px;border:1px solid #cbd5e1;background:#fff}select:disabled{background:#f8fafc;color:#64748b}
button{margin-top:28px;border:0;background:#111827;color:#fff;font-weight:700}button:disabled{background:#cbd5e1;color:#64748b}
#estado{min-height:24px;margin-top:10px;font-size:14px;color:#475569}.error{color:#b91c1c!important}
.card{margin-top:24px;padding:16px;border:1px solid #e2e8f0;border-radius:14px;background:#f8fafc}
.card strong{display:block;margin-bottom:8px}.fila{margin:6px 0}.oculto{display:none}
</style>
</head>
<body>
<main class="app">
<h1>#_Mtto_Preventivo</h1>

<section id="apertura">
<label for="placa">Placa</label>
<select id="placa">
<option value="">Selecciona placa...</option>
<option value="KPN 603" data-contratista="Vactor">KPN 603 — Vactor</option>
<option value="LPK 666" data-contratista="Vactor">LPK 666 — Vactor</option>
<option value="WOW 047" data-contratista="Vactor">WOW 047 — Vactor</option>
<option value="GFP 750" data-contratista="Vactor">GFP 750 — Vactor</option>
<option value="GKV 830" data-contratista="Succión">GKV 830 — Succión</option>
<option value="JLO 019" data-contratista="Succión">JLO 019 — Succión</option>
<option value="LPL301" data-contratista="Ingemac">LPL301 — Ingemac</option>
<option value="KPN 602" data-contratista="Ingemac">KPN 602 — Ingemac</option>
<option value="THQ 592" data-contratista="Ingemac">THQ 592 — Ingemac</option>
<option value="Otras" data-contratista="Otras">Otras — Otras</option>
</select>

<label for="tarea">Barrio / Tarea</label>
<select id="tarea" disabled><option value="">Primero selecciona una placa...</option></select>
<div id="estado"></div>
<button id="iniciar" disabled>Iniciar jornada</button>
</section>

<section id="jornada" class="oculto">
<div class="card">
<strong>Jornada activa</strong>
<div class="fila" id="j-placa"></div>
<div class="fila" id="j-contratista"></div>
<div class="fila" id="j-barrio"></div>
<div class="fila" id="j-tarea"></div>
<div class="fila" id="j-hora"></div>
</div>
</section>
</main>

<script>
const API='https://script.google.com/macros/s/AKfycbwDy1V9_-gn0p4fNwVFnQJKJgYewW5ZfjmkRJpV8ckUwXzXWExAIgbuw0x-dUXORV4T/exec';
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSfERpt4S-r5oDgoAsGMDFYq-RdhOiFsszFjjPTnA_Utm3ZSVQ/formResponse';
const STATE_KEY='mtto_prev_state_v2';
const SYNC_QUEUE_KEY='mtto_prev_sync_v2';

const placa=document.getElementById('placa'), tarea=document.getElementById('tarea'),
iniciar=document.getElementById('iniciar'), estado=document.getElementById('estado');

let seleccion={placa:'',contratista:'',idTarea:'',barrio:'',origenBarrio:''};

function fechaLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function mensaje(t='',e=false){estado.textContent=t;estado.className=e?'error':''}
function resetTarea(t='Primero selecciona una placa...'){tarea.innerHTML=`<option value="">${t}</option>`;tarea.disabled=true;iniciar.disabled=true}
function turnoDe(iso){const h=new Date(iso).getHours();return(h>=6&&h<18)?'Diurno':'Nocturno'}
function getGPS(){return new Promise(r=>{if(!navigator.geolocation){r(null);return}navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{timeout:8000})})}
async function reverseGeocode(g){if(!g)return'';try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${g.lat}&lon=${g.lng}&format=json`);const d=await r.json();const a=d.address||{};return a.suburb||a.neighbourhood||a.quarter||a.city_district||a.village||''}catch(e){return''}}

function cola(){try{return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY)||'[]')}catch(e){return[]}}
function guardarCola(c){localStorage.setItem(SYNC_QUEUE_KEY,JSON.stringify(c))}
function encolar(p){const c=cola();c.push(p);guardarCola(c)}

async function enviarPayload(p){
 const fd=new URLSearchParams();
 fd.append('entry.698566237',p.tipo||'');
 fd.append('entry.759456156',JSON.stringify(p.datos||{}));
 fd.append('entry.1958505050',p.placa||'');
 fd.append('entry.1438075125',p.contratista||'');
 fd.append('entry.1542290425',p.barrio||'');
 fd.append('entry.1617359207','');
 await fetch(FORM_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()});
}
async function enviarOEncolar(p){
 if(!navigator.onLine){encolar(p);return 'ENCOLADO'}
 try{await enviarPayload(p);return 'ENVIADO'}catch(e){encolar(p);return 'ENCOLADO'}
}

function procesarRespuesta(data){
 if(!data||data.ok!==true){resetTarea('No hay programación disponible');mensaje((data&&data.error)||'Respuesta no válida del Motor.',true);return}
 seleccion.contratista=data.contratista||seleccion.contratista;
 if(Array.isArray(data.tareas)&&data.tareas.length){
   tarea.innerHTML='<option value="">Selecciona Barrio / Tarea...</option>';
   data.tareas.forEach(t=>{const o=document.createElement('option');o.value=t.idTarea||'';o.textContent=t.nombre||t.barrio||t.idTarea;o.dataset.barrio=t.barrio||'';tarea.appendChild(o)});
   tarea.disabled=false;
   if(data.tareas.length===1){
     tarea.value=data.tareas[0].idTarea;
     seleccion.idTarea=data.tareas[0].idTarea||'';
     seleccion.barrio=data.tareas[0].barrio||data.tareas[0].nombre||'';
     seleccion.origenBarrio='TAREA';
     iniciar.disabled=false;
   }
   mensaje(''); return;
 }
 if(data.usarGPS===true&&data.contratista){resetTarea('Sin Tarea activa — usar ubicación');mensaje('Esta placa no tiene Tarea activa. El flujo GPS se incorporará en la siguiente etapa.');return}
 resetTarea('No hay programación disponible');mensaje('No fue posible determinar una Tarea.',true);
}

function cargarTareas(){
 const p=placa.value.trim();
 if(!p){seleccion={placa:'',contratista:'',idTarea:'',barrio:'',origenBarrio:''};resetTarea();mensaje();return}
 const opt=placa.options[placa.selectedIndex];
 seleccion={placa:p,contratista:opt.dataset.contratista||'',idTarea:'',barrio:'',origenBarrio:''};
 resetTarea('Consultando programación...');mensaje('Consultando programación...');
 const cb='mtto_'+Date.now(), s=document.createElement('script');let fin=false,timer;
 function limpiar(){if(fin)return;fin=true;clearTimeout(timer);try{delete window[cb]}catch(e){}s.remove()}
 window[cb]=d=>{limpiar();procesarRespuesta(d)};
 s.onerror=()=>{limpiar();resetTarea('No fue posible cargar la programación');mensaje('No fue posible conectar con el Motor.',true)};
 const q=new URLSearchParams({action:'tareasPorPlaca',placa:p,fecha:fechaLocal(),callback:cb,_:String(Date.now())});
 s.src=API+'?'+q.toString();document.head.appendChild(s);
 timer=setTimeout(()=>{limpiar();resetTarea('Sin respuesta del Motor');mensaje('El Motor no respondió.',true)},12000);
}

placa.addEventListener('change',cargarTareas);
tarea.addEventListener('change',()=>{
 const o=tarea.options[tarea.selectedIndex];
 seleccion.idTarea=tarea.value||'';
 seleccion.barrio=tarea.value?(o.dataset.barrio||o.textContent):'';
 seleccion.origenBarrio=tarea.value?'TAREA':'';
 iniciar.disabled=!(seleccion.placa&&seleccion.barrio&&seleccion.idTarea);
});

function mostrarJornada(st){
 document.getElementById('apertura').classList.add('oculto');
 document.getElementById('jornada').classList.remove('oculto');
 document.getElementById('j-placa').textContent='Placa: '+st.placa;
 document.getElementById('j-contratista').textContent='Contratista: '+st.contratista;
 document.getElementById('j-barrio').textContent='Barrio: '+st.barrio;
 document.getElementById('j-tarea').textContent='Tarea: '+st.idTarea;
 document.getElementById('j-hora').textContent='Inicio: '+new Date(st.horaInicio).toLocaleString('es-CO');
}

iniciar.addEventListener('click',async()=>{
 if(iniciar.disabled)return;
 iniciar.disabled=true;iniciar.textContent='Iniciando…';mensaje('Registrando apertura...');
 const horaInicio=new Date().toISOString();
 const gps=await getGPS();
 const direccion=await reverseGeocode(gps);
 const turno=turnoDe(horaInicio);
 const st={
   cerrada:false,modo:'operador',
   placa:seleccion.placa,contratista:seleccion.contratista,
   barrio:seleccion.barrio,idTarea:seleccion.idTarea,
   origenBarrio:'TAREA',horaInicio,
   gps:gps||null,
   cierre:{desob:'',m3:0,obs:'',tramosManuales:'',mlManual:0}
 };
 const payload={
   tipo:'jornadaInicio',
   datos:{
     lat:gps?gps.lat:'',lng:gps?gps.lng:'',
     direccion:direccion||'',turno,
     idTarea:st.idTarea,origenBarrio:'TAREA'
   },
   placa:st.placa,contratista:st.contratista,barrio:st.barrio
 };
 const resultado=await enviarOEncolar(payload);
 localStorage.setItem(STATE_KEY,JSON.stringify(st));
 mensaje(resultado==='ENVIADO'?'Jornada iniciada.':'Jornada iniciada. Envío pendiente por conexión.');
 mostrarJornada(st);
});

(function restaurar(){
 try{
   const st=JSON.parse(localStorage.getItem(STATE_KEY)||'null');
   if(st&&!st.cerrada&&st.horaInicio)mostrarJornada(st);
 }catch(e){}
})();
</script>
</body>
</html>
