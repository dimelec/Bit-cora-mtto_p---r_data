<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bitácora Preventiva</title>
<style>
  :root{
    --bg:#0d0f14; --card:#191c24; --card2:#212531; --line:#2d3340;
    --text:#f0f1f5; --sub:#9aa0ad; --accent:#f97316; --good:#22c55e;
    --warn:#f59e0b; --bad:#ef4444; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding-bottom:40px;}
  .screen{display:none; padding:16px; max-width:480px; margin:0 auto;}
  .screen.active{display:block;}
  h1{font-size:18px; margin:0 0 4px;}
  h2{font-size:15px; color:var(--sub); margin:0 0 16px; font-weight:500;}
  .card{background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  label{display:block; font-size:13px; color:var(--sub); margin:12px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], select{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:16px;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .hint{font-size:12px; color:var(--sub); margin-top:4px;}
  .hint.auto{color:var(--good);}
  .hint.error{color:var(--bad);}
  .btn{width:100%; padding:14px; border-radius:10px; font-size:15px; font-weight:600; background:var(--accent); color:#fff; margin-top:16px; border:none; cursor:pointer; font-family:inherit;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn.secondary{background:var(--card2); color:var(--text); border:1px solid var(--line);}
  .btn.danger{background:var(--bad);}
  .toggle2{display:flex; gap:10px; margin-top:6px;}
  .toggle2 button{flex:1; padding:14px; border-radius:10px; background:var(--card2); color:var(--text); border:1px solid var(--line); font-size:15px; font-weight:600; cursor:pointer;}
  .toggle2 button.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{padding:10px 14px; border-radius:20px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:14px; font-weight:500; cursor:pointer;}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .ring-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 6px;}
  svg.ring{width:170px; height:170px;}
  .ring-center{position:relative; margin-top:-125px; width:170px; text-align:center; pointer-events:none;}
  .ring-ml{font-size:28px; font-weight:700;}
  .ring-time{font-size:13px; color:var(--sub); margin-top:2px;}
  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--sub); margin:18px 0 8px;}
  .grid-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .action-btn{padding:16px 10px; border-radius:12px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:14px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
  .action-btn .ic{font-size:20px;}
  .action-btn:disabled{opacity:.3; cursor:not-allowed;}
  .tramo-open{background:var(--card2); border:1px solid var(--accent); border-radius:12px; padding:14px; margin-bottom:10px;}
  .close-tramo-btn{margin-top:12px; background:var(--bad); color:#fff; padding:10px; border-radius:8px; width:100%; font-weight:600; cursor:pointer; border:none;}
  .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; align-items:flex-end;}
  .overlay.active{display:flex;}
  .modal{background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:18px 18px 0 0; padding:20px 16px 26px; max-height:88vh; overflow-y:auto;}
  .modal h3{margin:0 0 14px; font-size:16px;}
  .modal-close{float:right; background:none; color:var(--sub); font-size:20px; padding:0 4px; cursor:pointer; border:none;}
  .summary-line{display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line);}
  .summary-line:last-child{border-bottom:none;}
  .legend-box{padding:14px; border-radius:10px; font-weight:600; font-size:14px; text-align:center; margin-top:10px;}
  .legend-good{background:#123322; color:var(--good);}
  .legend-bad{background:#3a2410; color:var(--warn);}
  .legend-info{background:#12233a; color:#60a5fa;}
  .toast{position:fixed; bottom:16px; left:16px; right:16px; max-width:448px; margin:0 auto; background:var(--card2); border:1px solid var(--accent); padding:12px 14px; border-radius:10px; font-size:13px; display:none; z-index:60;}
  .toast.show{display:block;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:8px; background:var(--accent); color:#fff; margin-left:6px;}
  .sync-status{text-align:center; font-size:12px; margin-bottom:10px; color:var(--good);}
  .tramo-sin-cerrar{color:var(--bad); font-weight:700;}
</style>
</head>
<body>

<!-- PANTALLA 1: APERTURA -->
<div class="screen active" id="screen-apertura">
  <h1>Nueva jornada</h1>
  <h2>Apertura</h2>
  <div class="card">
    <label>Placa</label>
    <input type="text" id="ap-placa" list="placas-lista" placeholder="Escribe para buscar..." autocomplete="off">
    <datalist id="placas-lista">
      <option value="KPN 603" data-contratista="Vactor">
      <option value="LPK 666" data-contratista="Vactor">
      <option value="WOW 047" data-contratista="Vactor">
      <option value="GFP 750" data-contratista="Vactor">
      <option value="GKV 830" data-contratista="Succión">
      <option value="JLO 019" data-contratista="Succión">
      <option value="LPL301" data-contratista="Ingemac">
      <option value="KPN 602" data-contratista="Ingemac">
    </datalist>
    <div class="hint" id="contratista-hint"></div>

    <label>Barrio <span class="badge" id="gps-status">GPS...</span></label>
    <input type="text" id="ap-barrio" placeholder="Se autocompleta por GPS">
    <div class="hint auto">📍 Autocompletado por GPS.</div>

    <button class="btn" id="btn-abrir-jornada" disabled>Iniciar jornada</button>
  </div>
</div>

<!-- PANTALLA 2: DASHBOARD -->
<div class="screen" id="screen-dashboard">
  <div class="sync-status" id="sync-status">● Listo</div>

  <div class="ring-wrap">
    <svg class="ring" viewBox="0 0 170 170">
      <circle cx="85" cy="85" r="72" fill="none" stroke="#242833" stroke-width="12"/>
      <circle id="ring-progress" cx="85" cy="85" r="72" fill="none" stroke="var(--accent)" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="452" stroke-dashoffset="452" transform="rotate(-90 85 85)"/>
    </svg>
    <div class="ring-center">
      <div class="ring-ml" id="disp-ml">0 ML</div>
      <div class="ring-time" id="disp-time">8:00 h</div>
    </div>
  </div>

  <button class="btn secondary" style="margin-bottom:8px;" onclick="verBitacoraCompleta()">📋 Ver bitácora completa</button>
  <button class="btn secondary" style="margin-bottom:10px;" onclick="generarHojaContingencia()">📄 Hoja de contingencia</button>

  <div id="tramo-abierto-box"></div>

  <div class="section-label">Tramo</div>
  <div class="grid-actions" id="box-sin-tramo">
    <input type="text" id="nuevo-tramo-nombre" placeholder="Solo números (máx 6)" maxlength="6" inputmode="numeric" style="grid-column:1/3;">
    <div class="toggle2" style="grid-column:1/3;">
      <button id="btn-flujo" onclick="seleccionarSentidoNuevo('Flujo')">Flujo</button>
      <button id="btn-contraflujo" onclick="seleccionarSentidoNuevo('Contraflujo')">Contraflujo</button>
    </div>
    <button class="btn" id="btn-abrir-tramo" style="grid-column:1/3;" disabled onclick="abrirTramo()">Abrir tramo</button>
  </div>

  <div class="section-label">Otras actividades</div>
  <div class="grid-actions">
    <button class="action-btn" onclick="abrirModal('modal-desob')" id="act-desob" disabled><span class="ic">🔧</span>Desobstrucción</button>
    <button class="action-btn" onclick="abrirModal('modal-m3')"><span class="ic">💧</span>Carga de agua</button>
    <button class="action-btn" onclick="abrirModal('modal-novedad')" style="grid-column:1/3;"><span class="ic">⚠️</span>Novedad</button>
  </div>

  <button class="btn secondary" style="margin-top:24px;" onclick="irACierreJornada()">Cerrar jornada</button>
</div>

<!-- MODALES Y CIERRE: igual que la versión anterior pero con las correcciones de lat/lng -->

<div class="toast" id="toast"></div>

<script>
/* ==================== CONFIG ==================== */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfhMKFjKQtPKiTzgf3tJOwai4u3taRsOTdP-NcQub6zmA7Yeg/formResponse";
const META_ML = 250;
const JORNADA_SEG = 8*3600;
const SYNC_QUEUE_KEY = "bitacora_sync_queue_v1";

/* ==================== ESTADO ==================== */
let STATE = {
  placa:null, contratista:null, barrio:null, gps:null,
  horaInicio:null, horaFin:null, inspector:null,
  tramos:[], sueltos:[], tramoActivoId:null,
  cerrada:false, actividadCount:0, bitacoraInterna:"",
  m3Total:0
};
let timerHandle=null;
let segRestantes = JORNADA_SEG;
let nuevoSentido = null;
let tempSentido = {desob:null};
let tempTipoNovedad = null;
let tempCausa = null;
let tempRegresa = null;
let tempApto = null;

/* ==================== UTILIDADES ==================== */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2600); }
function capitalizar(s){ if(!s) return s; return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase(); }
function nowISO(){ return new Date().toISOString(); }
function fmtHora(iso){ const d=new Date(iso); return d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); }
function round1(n){ return Math.round(n * 10) / 10; }
function getGPS(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude,lng:pos.coords.longitude}),
      ()=>resolve(null), {timeout:8000}
    );
  });
}
async function reverseGeocode(gps){
  if(!gps) return "";
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${gps.lat}&lon=${gps.lng}&format=json`);
    const d = await r.json();
    const a = d.address || {};
    return capitalizar(a.suburb || a.neighbourhood || a.quarter || a.city_district || a.village || "");
  }catch(e){ return ""; }
}

/* ==================== ENVÍO AL FORM ==================== */
function cargarCola(){ try{ return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || '[]'); }catch(e){ return []; } }
function guardarCola(cola){ try{ localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(cola)); }catch(e){} }
function actualizarEstadoSync(){
  const el = document.getElementById('sync-status');
  const cola = cargarCola();
  if(cola.length === 0){ el.textContent = '● Listo'; el.style.color = 'var(--good)'; }
  else { el.textContent = `● ${cola.length} pendiente(s)`; el.style.color = 'var(--warn)'; }
}
async function enviarPayload(payload) {
  const formData = new URLSearchParams();
  formData.append('entry.698566237', payload.tipo || '');
  formData.append('entry.759456156', JSON.stringify(payload.datos || {}));
  formData.append('entry.1958505050', payload.placa || '');
  formData.append('entry.1438075125', payload.contratista || '');
  formData.append('entry.1542290425', payload.barrio || '');
  formData.append('entry.1617359207', payload.inspector || '');
  await fetch(FORM_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: formData.toString()
  });
  return {ok:true};
}
async function enviarHitoRemoto(tipo, datos){
  const payload = {tipo, datos, placa:STATE.placa, contratista:STATE.contratista, barrio:STATE.barrio, inspector:STATE.inspector||''};
  try{ await enviarPayload(payload); actualizarEstadoSync(); }
  catch(e){ console.error('Error:', e); }
}

/* ==================== HOJA DE CONTINGENCIA ==================== */
function generarHojaContingencia(){
  const ventana = window.open('', '_blank', 'width=800,height=1000');
  const fecha = STATE.horaInicio ? new Date(STATE.horaInicio).toLocaleDateString('es-CO') : new Date().toLocaleDateString('es-CO');
  const turno = STATE.horaInicio ? (new Date(STATE.horaInicio).getHours() >= 6 && new Date(STATE.horaInicio).getHours() < 18 ? 'D' : 'N') : '';
  const mlTotal = STATE.tramos.filter(t=>t.cierre&&t.cierre.apto==='SI').reduce((s,t)=>s+(Number(t.cierre.ml)||0),0);
  const horas = STATE.horaInicio && STATE.horaFin ? round1((new Date(STATE.horaFin)-new Date(STATE.horaInicio))/3600000) : '';
  
  const tramosHTML = STATE.tramos.map((t,i)=>{
    const resultado = t.cierre ? (t.cierre.apto==='SI' ? `✅ APTO → ${t.cierre.ml} ML` : `❌ NO APTO → ${t.cierre.obs||''}`) : '⚠️ SIN CERRAR';
    return `<tr><td>${i+1}</td><td>#${t.tramo}</td><td>${t.horaInicio?fmtHora(t.horaInicio):''}</td><td>${resultado}</td></tr>`;
  }).join('');
  
  ventana.document.write(`
  <!DOCTYPE html>
  <html><head><meta charset="UTF-8"><title>Hoja de Contingencia</title>
  <style>
    @page{size:letter;margin:6mm}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:#fff;padding:10mm 8mm}
    .header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:3px solid #1a1a2e}
    .header-icon{width:35px;height:35px;background:#1a1a2e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
    .header-title{font-size:14px;font-weight:800;color:#1a1a2e}
    .header-sub{font-size:9px;color:#8a8a9a}
    .seccion{margin-bottom:8px;padding:8px 10px;background:#fafafa;border:1px solid #e0e0e5;border-radius:8px}
    .seccion-titulo{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#ff6b35;margin-bottom:6px}
    .fila{display:flex;gap:6px;align-items:center;font-size:11px;margin-bottom:4px}
    .tabla{width:100%;border-collapse:collapse;font-size:10px}
    .tabla th{background:#1a1a2e;color:#fff;padding:5px;text-align:center}
    .tabla td{padding:4px 5px;border-bottom:1px solid #e0e0e5;text-align:center}
    .resultado-box{background:#fff;border:2px solid #ff6b35;border-radius:6px;padding:6px;font-size:11px;font-weight:700;text-align:center;margin-top:4px}
    .btn-imprimir{background:#ff6b35;color:#fff;border:none;padding:12px 24px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px}
    @media print{.btn-imprimir{display:none}}
  </style>
  </head><body>
  
  <div class="header">
    <div class="header-icon">📋</div>
    <div>
      <div class="header-title">HOJA DE CONTINGENCIA — JORNADA</div>
      <div class="header-sub">Generada: ${new Date().toLocaleString('es-CO')} · Respaldar y archivar</div>
    </div>
  </div>
  
  <div class="seccion">
    <div class="seccion-titulo">Datos del turno</div>
    <div class="fila">
      Fecha: <b>${fecha}</b> | Placa: <b>${STATE.placa||'—'}</b> | Barrio: <b>${STATE.barrio||'—'}</b> | Turno: <b>${turno}</b>
    </div>
    <div class="fila">
      Inspector: <b>${STATE.inspector||'—'}</b> | Hora: <b>${STATE.horaInicio?fmtHora(STATE.horaInicio):'—'} a ${STATE.horaFin?fmtHora(STATE.horaFin):'—'}</b>
    </div>
  </div>
  
  <div class="seccion">
    <div class="seccion-titulo">Tramos</div>
    <table class="tabla">
      <tr><th>#</th><th>Código</th><th>Hora</th><th>Resultado</th></tr>
      ${tramosHTML || '<tr><td colspan="4">Sin tramos registrados</td></tr>'}
    </table>
  </div>
  
  <div class="seccion">
    <div class="seccion-titulo">Cierre</div>
    <div class="fila">ML total: <b>${mlTotal} ML</b> | Horas: <b>${horas} h</b> | M3: <b>${STATE.m3Total} m³</b></div>
    <div class="resultado-box">${mlTotal >= META_ML ? '✅ Meta cumplida' : '❌ No cumplida'}</div>
  </div>
  
  <div style="margin-top:12px;padding-top:6px;border-top:2px solid #1a1a2e;display:flex;justify-content:space-between;font-size:10px;">
    <div>Firma: ______________________</div>
    <div>Este documento es respaldo del cierre en el sistema.</div>
  </div>
  
  <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
  
  </body></html>`);
  ventana.document.close();
}

/* ==================== INICIO ==================== */
window.addEventListener('load', ()=>{ actualizarEstadoSync(); });
</script>
</body>
</html>
